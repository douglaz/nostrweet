[workspace]
members = [
    "crates/nostrweet-core",
    "crates/nostrweet-storage",
    "crates/nostrweet-twitter",
    "crates/nostrweet-nostr",
    "crates/nostrweet-blossom",
    "crates/nostrweet-cli",
    "crates/nostrweet-integration-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["nostrweet contributors"]

[workspace.dependencies]
anyhow = "1.0"
tokio = { version = "1.34", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tempfile = "3.8"
nostr-sdk = { git = "https://github.com/rust-nostr/nostr", branch = "master", default-features = false, features = ["all-nips"] }
hex = "0.4"
regex = "1.10"
url = "2.5"
html-escape = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
bip39 = "2.0"
sha2 = "0.10"
backoff = { version = "0.4", features = ["futures", "tokio"] }
dotenvy = "0.15"
